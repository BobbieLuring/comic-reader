name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # GitHub Pages serves a project site under /<repo>/, so the app must be
      # built with that base path. github.event.repository.name supplies it.
      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages has no SPA fallback; serving index.html for unknown paths
      # lets a hard refresh on /read/:id reach the Angular router.
      - name: SPA fallback
        run: cp dist/comic-reader/browser/index.html dist/comic-reader/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/comic-reader/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
